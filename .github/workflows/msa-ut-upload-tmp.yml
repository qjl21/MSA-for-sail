name: msa temporary wheel upload

# Build a wheel on every board, run the check-in suite, then publish the wheels to a
# temporary directory. Publishing is gated on the suite: a failing board skips the push
# and the wheel stays available as an Actions artifact only.
# Requires RELEASE_USERNAME / RELEASE_TOKEN secrets (TEMPLATE_TOKEN for private templates).
on:
  # 19:30 Asia/Shanghai daily (cron is UTC).
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      matrix:
        description: "JSON array of PPU runner board types"
        required: false
        type: string
        default: '["ZW-M890P", "ZW-810E"]'

permissions:
  contents: read

concurrency:
  group: msa-ut-upload-tmp-${{ github.ref }}
  cancel-in-progress: true

env:
  SAIL_IMAGE: download.t-head.cn/docker_release/pytorch:sdk2.2.0-2.10.0-ubuntu24.04-hggcrt3-py312-20261005

jobs:
  # Self-contained on purpose: the check-in workflow no longer uploads a wheel, so this
  # job rebuilds from the nightly checkout and is the only source of the published wheel.
  # The actlize source_mode is a check-in concern and is deliberately not supported here.
  build-test:
    name: Build & Test (${{ matrix.runner }})
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # Results are kept per runner on NAS, so the two boards never collide.
        runner: ${{ fromJson(inputs.matrix || '["ZW-M890P", "ZW-810E"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and the release tag are needed to derive the version.
          fetch-depth: 0
          # python/fmha_ppu/actlize provides the headers the JIT build includes.
          submodules: recursive
          persist-credentials: false
      - name: Build and Test on PPU
        id: ppu-test
        uses: t-head/ci-infra/cluster-run@main
        with:
          image: ${{ env.SAIL_IMAGE }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=${{ matrix.runner }}"
          namespace: ppu-sched
          timeout_minutes: 300
          command: |
            set -ex
            cd /workspace/source
            # Fix: image bakes in PIP_INDEX_URL pointing to unreachable internal server
            unset PIP_INDEX_URL
            # Fix: image bakes in git insteadOf redirecting github.com to unreachable internal gerrit
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory '*'
            source /usr/local/PPU_SDK/envsetup.sh || true
            which hgcc || true
            echo $PPU_SDK
            pip install setuptools==69.5.1
            # Pin so the build never re-fetches it from the (unreachable) internal index.
            pip install setuptools-scm==9.2.2
            pip install junit-xml wheel ninja
            pip install --upgrade pytest
            pip install apache-tvm-ffi jinja2

            echo "START TO CHECKOUT actlize submodule"
            git submodule update --init --recursive

            echo "START TO BUILD WHEEL"
            LOG_FILE="build.log"
            ERROR_LOG="error.log"
            set +e
            python ./setup.py bdist_wheel > "$LOG_FILE" 2> "$ERROR_LOG"
            BUILD_EXIT_CODE=$?
            set -e
            if [ "$BUILD_EXIT_CODE" -ne 0 ]; then
                echo "Build failed with exit code $BUILD_EXIT_CODE"
                cat "$ERROR_LOG"
                echo "----- last 1000 lines of $LOG_FILE -----"
                tail -n 1000 "$LOG_FILE"
                # NAS survives the Pod.
                NAS_RESULT_DIR="/mnt/wl_nas/devops/msa-ci/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}"
                mkdir -p "$NAS_RESULT_DIR"
                cp "$LOG_FILE" "$ERROR_LOG" "$NAS_RESULT_DIR/" 2>/dev/null || true
                exit 1
            fi
            echo "✅ Build succeeded!"
            tail -n 200 "$LOG_FILE"

            # Stage on NAS before testing so a failed suite still has a wheel to upload.
            NAS_RESULT_DIR="/mnt/wl_nas/devops/msa-ci/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}"
            mkdir -p "$NAS_RESULT_DIR/wheels"
            cp dist/*.whl "$NAS_RESULT_DIR/wheels/"

            echo "START TO INSTALL WHEEL"
            pip install dist/*.whl --force-reinstall --no-deps
            echo "START TO TEST CASES"
            set +e
            python .github/workflows/scripts/pr-msa-ut.py \
              --caselist .github/workflows/scripts/casecmd.list
            TEST_EXIT_CODE=$?
            python3 .github/workflows/scripts/generate-env-info.py \
              --docker-image "${{ env.SAIL_IMAGE }}" \
              --output env_info.json
            mkdir -p "$NAS_RESULT_DIR"
            cp test-results.xml "$NAS_RESULT_DIR/" 2>/dev/null || true
            cp env_info.json "$NAS_RESULT_DIR/" 2>/dev/null || true
            # A failed suite must fail the job so publishing is skipped.
            exit "$TEST_EXIT_CODE"
          cleanup_policy: on_success

      - name: Upload wheel (${{ matrix.runner }})
        # Only the first leg uploads: wheels are board independent. always() keeps
        # the artifact available even when the check-in phase failed.
        if: ${{ always() && strategy.job-index == 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: msa-wheel-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}
          path: /wl_nas/devops/msa-ci/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}/wheels/*.whl
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

      - name: Test summary (${{ matrix.runner }})
        if: always()
        shell: bash
        run: |
          NAS_RESULT_DIR="/wl_nas/devops/msa-ci/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}"
          XML_FILE="$NAS_RESULT_DIR/test-results.xml"
          ENV_FILE="$NAS_RESULT_DIR/env_info.json"
          echo "## Runner: ${{ matrix.runner }}" >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -f "$XML_FILE" ]]; then
            echo "JUnit report not found: $XML_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo "If the build failed, its logs are kept under $NAS_RESULT_DIR/ (build.log / error.log)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 .github/workflows/scripts/display-test-summary.py \
            "$XML_FILE" --env-info "$ENV_FILE"

  merge:
    name: Merge board wheel artifacts
    # needs gates on build-test, so a failed suite never reaches the push job.
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.artifact_name }}
    steps:
      - name: Set merged artifact name
        id: artifact-name
        shell: bash
        run: |
          echo "artifact_name=msa-wheels-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      # The build job names its artifact per runner; the push template needs one
      # stable name, so collapse the per-board artifacts into a single one.
      - name: Merge wheel artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: ${{ steps.artifact-name.outputs.artifact_name }}
          pattern: msa-wheel-${{ github.run_id }}-${{ github.run_attempt }}-*
          compression-level: 0
          delete-merged: false

  push:
    name: Call temporary wheel upload template
    needs: merge
    uses: t-head/ci-infra/.github/workflows/push-tmp-wheel.yml@main
    with:
      # run_attempt moves when only the publishing job is rerun.
      artifact_name: ${{ needs.merge.outputs.artifact_name }}
      template_repository: t-head/ci-infra
      template_ref: main
    secrets:
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
      template_token: ${{ secrets.TEMPLATE_TOKEN }}

  result:
    name: Show batch directory URL
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write to logs and job summary
        shell: bash
        env:
          UPLOAD_URL: ${{ needs.push.outputs.upload_url }}
        run: |
          set -euo pipefail
          printf 'Batch directory: %s\n' "$UPLOAD_URL" | tee -a "$GITHUB_STEP_SUMMARY"
